collect_info_task:
  name: Collect Complete Ticket Information
  description: >
    Based on the initial message '{initial_message}', collect detailed information about the person by: 
    Finding out the ticket_id, subject, description, first_name, last_name, email, device_type, browser, os_version, steps_to_reproduce,
    priority, screenshot_url, status of the ticket. Ask questions in a natural way. 
    Store all collected information in a structured format.
  expected_output: >
    All required fields of ticket info. None can be missing.
  agent: information_collector
  output_file: ticket.json
  human_input: false

summarize_ticket_task:
  name: Save to Database and Create Summary
  description: >
    This task has three critical responsibilities that must be performed in sequence:
    
    1) FIRST: Use the SaveTicketTool to save the ticket information from the ticket.json file
    to the MySQL database. This ensures all collected user data is persistently stored.
    The ticket.json file contains ALL fields from the TicketInfo model including:
    ticket_id, subject, description, first_name, last_name, email, device_type, browser,
    os_version, screenshot_url, steps_to_reproduce, priority, and status.
    
    2) SECOND: Generate a comprehensive ticket summary that includes ALL the information 
    collected in the previous task. The summary must include:
       - Full customer name (first and last name)
       - Contact details (email)
       - Issue description (both subject and detailed description)
       - Technical details (device type, browser, OS version)
       - Steps to reproduce the issue
       - Priority level
       - Ticket ID for reference
    
    3) THIRD: Use the NotificationToolWrapper to send the ticket summary to Slack and/or Telegram 
    channels. Check the environment variables for SLACK_CHANNEL and TELEGRAM_CHAT_ID to determine 
    where to send the notifications.
    
    Do not omit any collected information in your summary. If a field was marked as "not available,"
    explicitly mention this in the summary. Begin your response by confirming whether the database
    save operation was successful.
  expected_output: >
    A confirmation of successful database storage and notification delivery, followed by a comprehensive 
    summary of ALL collected ticket information, clearly formatted for support team reference. 
    The summary must include every field from the TicketInfo model that was collected, with nothing omitted.
  agent: information_summarizer
  context:
    - collect_info_task

